$kind: http-request
name: Update Review
method: PATCH
url: '{{base_url}}/reviews/1'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rating": 4,
      "comment": "Great views - worth visiting."
    }
