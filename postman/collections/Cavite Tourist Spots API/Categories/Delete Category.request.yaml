$kind: http-request
name: Delete Category
method: DELETE
url: '{{base_url}}/categories/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{test_category_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
        pm.response.to.have.status(204);
      });

      pm.collectionVariables.unset("test_category_id");
