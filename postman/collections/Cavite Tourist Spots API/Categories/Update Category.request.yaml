$kind: http-request
name: Update Category
method: PATCH
url: '{{base_url}}/categories/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{test_category_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Updated Test Category",
      "category_description": "Updated description during testing."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("category_name was updated", function () {
        const json = pm.response.json();
        pm.expect(json.category_name).to.eql("Updated Test Category");
      });

      pm.test("Response has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("category_id");
        pm.expect(json).to.have.property("category_name");
      });
