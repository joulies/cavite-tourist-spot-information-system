$kind: http-request
name: Create Photo
method: POST
url: '{{base_url}}/photos'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "spot_id": 1,
      "photo_url": "https://example.com/peoples-park.jpg",
      "caption": "View from People's Park in the Sky"
    }
